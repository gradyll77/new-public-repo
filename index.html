<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algo 7 Market Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .header {
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      color: #38bdf8;
    }
    .header p {
      margin: 0;
      font-size: 0.875rem;
      color: #94a3b8;
    }
    .status-container {
      margin-bottom: 16px;
      font-size: 0.875rem;
      color: #cbd5e1;
    }
    .table-container {
      overflow-x: auto;
      border: 1px solid #334155;
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
    }
    th {
      background-color: #1e293b;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .score-high {
      color: #4ade80;
      font-weight: 600;
    }
    .score-med {
      color: #facc15;
      font-weight: 600;
    }
    .score-low {
      color: #f87171;
      font-weight: 600;
    }
    .error-msg {
      color: #f87171;
      padding: 16px;
      background: #450a0a;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Algo 7 Swing Trading Dashboard</h1>
    <p>Automated quantitative ratings & leader tracking</p>
  </div>

  <div id="status" class="status-container">Loading latest market data...</div>
  <div id="error" class="error-msg"></div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Algo 7 Score</th>
          <th>Conviction Grade</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="table-body">
      </tbody>
    </table>
  </div>

  <script>
    async function loadScreenerData() {
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');
      const tableBody = document.getElementById('table-body');

      // Attempt loading JSON from both possible paths automatically
      const paths = ['screener_data.json', 'docs/screener_data.json'];
      let data = null;

      for (const path of paths) {
        try {
          const response = await fetch(path + '?t=' + new Date().getTime());
          if (response.ok) {
            data = await response.json();
            break;
          }
        } catch (e) {
          // Continue to next path candidate
        }
      }

      if (!data) {
        statusEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.innerText = 'Unable to load screener data. Please verify workflow execution on GitHub.';
        return;
      }

      statusEl.innerText = 'Market Regime: ' + (data.market_regime || 'ACTIVE') + ' | Last Updated: ' + (data.last_updated || 'Recent');

      const items = data.tickers || data.results || [];
      tableBody.innerHTML = '';

      if (items.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8;">No tickers currently qualified.</td></tr>';
        return;
      }

      items.forEach(item => {
        const row = document.createElement('tr');
        
        let scoreClass = 'score-med';
        if (item.score >= 70) scoreClass = 'score-high';
        if (item.score < 40) scoreClass = 'score-low';

        row.innerHTML = `
          <td style="font-weight:600;">${item.symbol || item.ticker || 'N/A'}</td>
          <td class="${scoreClass}">${item.score !== undefined ? item.score : 'N/A'}</td>
          <td>${item.grade || item.conviction || 'N/A'}</td>
          <td style="color:#94a3b8;">${item.status || 'Monitored'}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    loadScreenerData();
  </script>
</body>
</html>
